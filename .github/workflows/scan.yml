name: Secret Guard history-scan tests
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  scan:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        python: ["3.11", "3.13"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: History scanner (synthetic homes and synthetic keys only)
        run: python tests/test_history_scan.py
      - name: Operating-system tracer for the artifact evidence tests (Linux only)
        if: runner.os == 'Linux'
        run: sudo apt-get update -qq && sudo apt-get install -y -qq strace && strace -V | head -1
      - name: Database-artifact byte scan (synthetic databases only)
        run: python tests/test_artifact_scan.py
